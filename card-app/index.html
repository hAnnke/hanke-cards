<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cards">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898083.png">
  <link rel="manifest" href="manifest.json">
  <title>Flashcards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .perspective { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6 select-none font-sans">

  <!-- Header -->
  <header class="w-full max-w-sm flex justify-between items-center pt-8 pb-4">
    <div class="text-xs uppercase tracking-widest text-slate-400 font-bold" id="card-counter">1 / 1</div>
    <button onclick="toggleModal()" class="bg-indigo-600 active:scale-95 transition-all text-xs font-semibold px-3 py-1.5 rounded-full shadow-lg shadow-indigo-600/30">
      + Слово
    </button>
  </header>

  <!-- Card Container -->
  <main class="w-full max-w-sm flex-1 flex flex-col justify-center items-center perspective">
    <div id="card" onclick="flipCard()" class="w-full h-80 relative transition-transform duration-500 transform-style-3d cursor-pointer">
      
      <!-- Front (Немецкий) -->
      <div class="absolute inset-0 bg-slate-800 border border-slate-700 rounded-3xl p-6 flex flex-col justify-between items-center backface-hidden shadow-2xl">
        <div class="w-full flex justify-end">
          <button onclick="speakCurrent(event)" class="p-2 rounded-full bg-slate-700/60 active:bg-slate-600 text-indigo-400">
            🔊
          </button>
        </div>
        <div class="text-center px-4">
          <h2 id="card-front" class="text-2xl font-bold tracking-tight text-white mb-2"></h2>
          <p class="text-xs text-slate-400 uppercase tracking-wider">Нажми, чтобы перевернуть</p>
        </div>
        <div class="h-6"></div>
      </div>

      <!-- Back (Перевод) -->
      <div class="absolute inset-0 bg-indigo-950 border border-indigo-700/50 rounded-3xl p-6 flex flex-col justify-center items-center backface-hidden rotate-y-180 shadow-2xl text-center">
        <p class="text-xs text-indigo-300 uppercase tracking-wider mb-2 font-semibold">Перевод</p>
        <h2 id="card-back" class="text-xl font-medium text-white"></h2>
      </div>

    </div>
  </main>

  <!-- Action Controls -->
  <footer class="w-full max-w-sm flex gap-4 pb-6">
    <button onclick="nextCard(false)" class="flex-1 py-4 bg-slate-800 active:bg-rose-950 active:border-rose-700 border border-slate-700 text-rose-400 font-semibold rounded-2xl shadow-lg transition-all active:scale-98">
      Повторить
    </button>
    <button onclick="nextCard(true)" class="flex-1 py-4 bg-slate-800 active:bg-emerald-950 active:border-emerald-700 border border-slate-700 text-emerald-400 font-semibold rounded-2xl shadow-lg transition-all active:scale-98">
      Знаю
    </button>
  </footer>

  <!-- Modal: Добавить слово -->
  <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex justify-center items-end hidden z-50">
    <div class="bg-slate-800 w-full max-w-md p-6 rounded-t-3xl border-t border-slate-700 space-y-4">
      <h3 class="text-lg font-bold text-white">Новая карточка</h3>
      <input id="new-front" placeholder="Немецкое слово / фраза (с артиклем)" class="w-full p-3.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500">
      <input id="new-back" placeholder="Перевод" class="w-full p-3.5 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-indigo-500">
      <div class="flex gap-3 pt-2">
        <button onclick="toggleModal()" class="flex-1 py-3 bg-slate-700 rounded-xl font-semibold text-slate-300">Отмена</button>
        <button onclick="saveCard()" class="flex-1 py-3 bg-indigo-600 rounded-xl font-semibold text-white">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    const defaultCards = [
      { front: "das Vorstellungsgespräch", back: "собеседование" },
      { front: "die Erfahrung", back: "опыт" },
      { front: "sich bewerben um", back: "подавать заявку на (вакансию)" }
    ];

    let cards = JSON.parse(localStorage.getItem('my_cards')) || defaultCards;
    let currentIndex = 0;
    let isFlipped = false;

    const cardEl = document.getElementById('card');
    const frontEl = document.getElementById('card-front');
    const backEl = document.getElementById('card-back');
    const counterEl = document.getElementById('card-counter');

    function renderCard() {
      if (cards.length === 0) return;
      isFlipped = false;
      cardEl.classList.remove('rotate-y-180');
      frontEl.innerText = cards[currentIndex].front;
      backEl.innerText = cards[currentIndex].back;
      counterEl.innerText = `${currentIndex + 1} / ${cards.length}`;
    }

    function flipCard() {
      isFlipped = !isFlipped;
      cardEl.classList.toggle('rotate-y-180', isFlipped);
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % cards.length;
      renderCard();
    }

    function speakCurrent(e) {
      e.stopPropagation();
      const utterance = new SpeechSynthesisUtterance(cards[currentIndex].front);
      utterance.lang = 'de-DE';
      window.speechSynthesis.speak(utterance);
    }

    function toggleModal() {
      document.getElementById('modal').classList.toggle('hidden');
    }

    function saveCard() {
      const front = document.getElementById('new-front').value.trim();
      const back = document.getElementById('new-back').value.trim();
      if (front && back) {
        cards.push({ front, back });
        localStorage.setItem('my_cards', JSON.stringify(cards));
        document.getElementById('new-front').value = '';
        document.getElementById('new-back').value = '';
        toggleModal();
        currentIndex = cards.length - 1;
        renderCard();
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    renderCard();
  </script>
</body>
</html>
