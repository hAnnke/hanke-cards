<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MyCards V3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { overscroll-behavior-y: none; }
    .perspective-1000 { perspective: 1000px; }
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .snap-back { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .flip-anim { transition: transform 0.4s ease-in-out; }
    /* Анимация уведомлений */
    .toast-enter { transform: translateY(100%); opacity: 0; }
    .toast-active { transform: translateY(0); opacity: 1; transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen overflow-hidden flex flex-col font-sans select-none">

  <!-- ================= NAV BAR ================= -->
  <nav class="pt-12 pb-4 px-6 flex justify-between items-center bg-slate-900 border-b border-slate-800 z-10">
    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400 cursor-pointer" onclick="goHome()">
      MyCards
    </h1>
    <div id="nav-actions" class="text-sm font-semibold text-indigo-400">
      <!-- Динамические кнопки -->
    </div>
  </nav>

  <!-- ================= TOAST NOTIFICATION ================= -->
  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-6 py-3 rounded-full shadow-2xl z-[100] toast-enter pointer-events-none flex items-center gap-2">
    <span id="toast-icon">✨</span>
    <span id="toast-msg" class="text-sm font-medium">Уведомление</span>
  </div>

  <!-- ================= VIEW: DECKS (HOME) ================= -->
  <main id="view-home" class="flex-1 flex flex-col p-6 overflow-y-auto w-full max-w-md mx-auto relative">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold">Мои колоды</h2>
      <button onclick="createNewDeck()" class="text-indigo-400 text-sm font-bold bg-indigo-500/10 px-4 py-2 rounded-xl active:bg-indigo-500/20">
        + Создать
      </button>
    </div>
    <div id="decks-container" class="space-y-4 pb-20">
      <!-- Список колод рендерится здесь -->
    </div>
  </main>

  <!-- ================= VIEW: DECK DETAILS ================= -->
  <main id="view-deck" class="hidden flex-1 flex flex-col p-6 overflow-y-auto w-full max-w-md mx-auto">
    <div class="bg-slate-800 rounded-2xl p-6 mb-6 border border-slate-700">
      <h2 class="text-sm text-slate-400 uppercase tracking-wider mb-1">Колода</h2>
      <h3 id="deck-title" class="text-2xl font-bold text-white mb-4">Название</h3>
      
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="bg-slate-900 rounded-xl p-4 border border-slate-700/50">
          <p class="text-2xl font-black text-indigo-400" id="deck-due">0</p>
          <p class="text-[10px] text-slate-400 uppercase font-bold">Для повторения</p>
        </div>
        <div class="bg-slate-900 rounded-xl p-4 border border-slate-700/50">
          <p class="text-2xl font-black text-emerald-400" id="deck-total">0</p>
          <p class="text-[10px] text-slate-400 uppercase font-bold">Всего карточек</p>
        </div>
      </div>

      <div class="space-y-3">
        <button onclick="startStudy(false)" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-[0.98] transition-all">
          Учить новые / по плану
        </button>
        <button onclick="startStudy(true)" class="w-full bg-slate-700 text-slate-300 font-bold py-3.5 rounded-xl border border-slate-600 active:scale-[0.98] transition-all">
          Повторить ВСЁ (Cram mode)
        </button>
      </div>
    </div>
  </main>

  <!-- ================= VIEW: ADD CARD ================= -->
  <main id="view-add" class="hidden flex-1 flex flex-col p-6 overflow-y-auto w-full max-w-md mx-auto">
    <h2 class="text-2xl font-bold mb-6">Новая карточка</h2>
    <div class="space-y-4">
      <div>
        <div class="flex justify-between items-end mb-1">
          <label class="text-xs text-slate-400 uppercase">Слово / Фраза (DE)</label>
          <button onclick="autoTranslate()" id="btn-translate" class="text-[10px] font-bold bg-slate-800 text-indigo-400 px-3 py-1 rounded-lg border border-slate-700 active:bg-slate-700">
            🪄 Перевести
          </button>
        </div>
        <input id="input-front" type="text" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-lg">
      </div>
      <div>
        <label class="text-xs text-slate-400 uppercase">Перевод (RU)</label>
        <input id="input-back" type="text" class="w-full mt-1 p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-lg">
      </div>
      <div>
        <label class="text-xs text-slate-400 uppercase">Пример (необязательно)</label>
        <textarea id="input-example" rows="2" class="w-full mt-1 p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-indigo-500"></textarea>
      </div>
      <button onclick="saveNewCard()" class="w-full py-4 mt-4 bg-indigo-600 active:bg-indigo-700 rounded-xl font-bold text-white shadow-lg transition-transform active:scale-[0.98]">
        Добавить в колоду
      </button>
    </div>
  </main>

  <!-- ================= VIEW: STUDY (TINDER) ================= -->
  <main id="view-study" class="hidden fixed inset-0 z-50 bg-slate-900 flex flex-col pt-12 pb-8 px-6">
    <div class="flex justify-between items-center mb-8">
      <button onclick="exitStudy()" class="text-slate-400 font-bold px-4 py-2 bg-slate-800 rounded-full active:bg-slate-700 border border-slate-700">Завершить</button>
      <div class="text-sm font-bold text-slate-300 bg-slate-800 px-4 py-2 rounded-full border border-slate-700" id="study-counter">0 / 0</div>
    </div>

    <div class="flex-1 relative flex justify-center items-center perspective-1000 w-full max-w-sm mx-auto" id="card-area">
      <div id="swipe-container" class="w-full h-96 absolute cursor-grab active:cursor-grabbing z-10">
        <div id="flip-container" class="w-full h-full relative preserve-3d flip-anim shadow-2xl">
          <!-- FRONT -->
          <div class="absolute inset-0 bg-slate-800 rounded-3xl border border-slate-700 p-6 flex flex-col justify-center items-center backface-hidden">
            <p id="study-mode-badge" class="text-[10px] bg-indigo-500/20 text-indigo-300 uppercase tracking-widest absolute top-6 px-3 py-1 rounded-full border border-indigo-500/30">Обучение</p>
            <h2 id="study-front" class="text-3xl font-bold text-white text-center"></h2>
            <p class="text-sm text-slate-500 absolute bottom-6 flex items-center gap-2">Нажми, чтобы перевернуть</p>
          </div>
          <!-- BACK -->
          <div class="absolute inset-0 bg-indigo-950 rounded-3xl border border-indigo-700/50 p-6 flex flex-col justify-center items-center backface-hidden rotate-y-180">
            <p class="text-xs text-indigo-300 uppercase tracking-widest absolute top-6 font-bold">Перевод</p>
            <h2 id="study-back" class="text-2xl font-semibold text-white text-center mb-4"></h2>
            <div id="study-example-container" class="w-full bg-slate-900/50 p-4 rounded-xl border border-indigo-500/30 text-center">
              <p id="study-example" class="text-sm text-slate-300 italic"></p>
            </div>
            <div class="absolute bottom-6 w-full px-6 flex justify-between text-xs font-bold uppercase tracking-wider">
              <span class="text-rose-400">← Не помню</span>
              <span class="text-emerald-400">Помню →</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // --- ДАННЫЕ И СТРУКТУРА ---
    let decks = JSON.parse(localStorage.getItem('mydecks_v3')) || [{ id: 'default', name: 'Мои слова' }];
    let cards = JSON.parse(localStorage.getItem('mycards_v3')) || [];
    
    const SRS_INTERVALS = [1, 10, 1440, 5760]; 
    let currentDeckId = null;
    let studyQueue = [];
    let initialQueueLength = 0;
    let currentStudyCard = null;
    let isFlipped = false;
    let isCramMode = false; // Режим зубрежки без влияния на прогресс

    // --- УВЕДОМЛЕНИЯ (TOAST) ---
    let toastTimeout;
    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      document.getElementById('toast-icon').innerText = icon;
      toast.classList.remove('toast-enter');
      toast.classList.add('toast-active');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('toast-active');
        toast.classList.add('toast-enter');
      }, 2500);
    }

    // --- НАВИГАЦИЯ ---
    function hideAllViews() {
      ['view-home', 'view-deck', 'view-add', 'view-study'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById('nav-actions').innerHTML = '';
    }

    function goHome() {
      hideAllViews();
      document.getElementById('view-home').classList.remove('hidden');
      renderDecks();
    }

    function openDeck(id) {
      currentDeckId = id;
      hideAllViews();
      document.getElementById('view-deck').classList.remove('hidden');
      
      const deck = decks.find(d => d.id === id);
      const deckCards = cards.filter(c => c.deckId === id);
      const dueCards = deckCards.filter(c => c.nextReview <= Date.now());

      document.getElementById('deck-title').innerText = deck.name;
      document.getElementById('deck-due').innerText = dueCards.length;
      document.getElementById('deck-total').innerText = deckCards.length;

      document.getElementById('nav-actions').innerHTML = `
        <button onclick="openAddCard()" class="px-3 py-1 bg-slate-800 rounded-lg active:bg-slate-700">+ Карточка</button>
      `;
    }

    function openAddCard() {
      hideAllViews();
      document.getElementById('view-add').classList.remove('hidden');
      document.getElementById('nav-actions').innerHTML = `
        <button onclick="openDeck('${currentDeckId}')" class="text-slate-400">Назад</button>
      `;
    }

    // --- ЛОГИКА КОЛОД ---
    function renderDecks() {
      const container = document.getElementById('decks-container');
      container.innerHTML = '';
      
      decks.forEach(deck => {
        const deckCards = cards.filter(c => c.deckId === deck.id);
        const dueCount = deckCards.filter(c => c.nextReview <= Date.now()).length;
        
        container.innerHTML += `
          <div onclick="openDeck('${deck.id}')" class="bg-slate-800 border border-slate-700 rounded-2xl p-5 flex justify-between items-center cursor-pointer active:scale-[0.98] transition-transform shadow-lg">
            <div>
              <h3 class="text-lg font-bold text-white">${deck.name}</h3>
              <p class="text-xs text-slate-400 mt-1">${deckCards.length} слов</p>
            </div>
            ${dueCount > 0 ? `<div class="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full">${dueCount} ждет</div>` : ''}
          </div>
        `;
      });
    }

    function createNewDeck() {
      const name = prompt("Название новой колоды:");
      if (name && name.trim()) {
        const newDeck = { id: Date.now().toString(), name: name.trim() };
        decks.push(newDeck);
        localStorage.setItem('mydecks_v3', JSON.stringify(decks));
        renderDecks();
        showToast('Колода создана', '📁');
      }
    }

    // --- ЛОГИКА КАРТОЧЕК ---
    async function autoTranslate() {
      const inputFront = document.getElementById('input-front');
      const btn = document.getElementById('btn-translate');
      const word = inputFront.value.trim();
      
      if (!word) return showToast('Сначала введите слово', '⚠️');
      
      btn.innerText = '⏳...';
      try {
        // Бесплатный API для перевода без ключа
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=de|ru`);
        const data = await res.json();
        if (data && data.responseData && data.responseData.translatedText) {
          document.getElementById('input-back').value = data.responseData.translatedText;
          showToast('Переведено!', '✅');
        }
      } catch (e) {
        showToast('Ошибка перевода', '❌');
      }
      btn.innerText = '🪄 Перевести';
    }

    function saveNewCard() {
      const front = document.getElementById('input-front').value.trim();
      const back = document.getElementById('input-back').value.trim();
      const example = document.getElementById('input-example').value.trim();

      if (!front || !back) return showToast('Заполните слово и перевод', '⚠️');

      cards.push({
        id: Date.now().toString(),
        deckId: currentDeckId,
        front, back, example,
        srsLevel: 0,
        nextReview: Date.now()
      });
      localStorage.setItem('mycards_v3', JSON.stringify(cards));
      
      document.getElementById('input-front').value = '';
      document.getElementById('input-back').value = '';
      document.getElementById('input-example').value = '';
      
      showToast('Добавлено в колоду', '🃏');
      openDeck(currentDeckId);
    }

    // --- РЕЖИМ ОБУЧЕНИЯ И СВАЙПЫ ---
    function startStudy(cramMode) {
      const deckCards = cards.filter(c => c.deckId === currentDeckId);
      isCramMode = cramMode;

      if (isCramMode) {
        studyQueue = [...deckCards].sort(() => Math.random() - 0.5); // Перемешать всё
      } else {
        const now = Date.now();
        studyQueue = deckCards.filter(c => c.nextReview <= now).sort((a,b) => a.nextReview - b.nextReview);
      }
      
      if (studyQueue.length === 0) return showToast('Нет карточек для повторения', '🎉');

      initialQueueLength = studyQueue.length;
      hideAllViews();
      document.getElementById('view-study').classList.remove('hidden');
      
      const badge = document.getElementById('study-mode-badge');
      badge.innerText = isCramMode ? 'Повторение (Cram)' : 'По плану (SRS)';
      badge.className = isCramMode ? 'text-[10px] bg-amber-500/20 text-amber-300 uppercase tracking-widest absolute top-6 px-3 py-1 rounded-full border border-amber-500/30' 
                                   : 'text-[10px] bg-indigo-500/20 text-indigo-300 uppercase tracking-widest absolute top-6 px-3 py-1 rounded-full border border-indigo-500/30';
      
      loadNextCard();
    }

    function exitStudy() {
      openDeck(currentDeckId);
    }

    function loadNextCard() {
      if (studyQueue.length === 0) {
        showToast('Сессия окончена!', '🎓');
        return exitStudy();
      }

      currentStudyCard = studyQueue[0];
      isFlipped = false;
      
      const flipCont = document.getElementById('flip-container');
      const swipeCont = document.getElementById('swipe-container');
      flipCont.classList.remove('rotate-y-180');
      swipeCont.style.transform = '';
      swipeCont.style.opacity = '1';

      const currentNum = initialQueueLength - studyQueue.length + 1;
      document.getElementById('study-counter').innerText = `${currentNum} / ${initialQueueLength}`;
      document.getElementById('study-front').innerText = currentStudyCard.front;
      document.getElementById('study-back').innerText = currentStudyCard.back;
      
      const exCont = document.getElementById('study-example-container');
      if (currentStudyCard.example) {
        exCont.style.display = 'block';
        document.getElementById('study-example').innerText = currentStudyCard.example;
      } else {
        exCont.style.display = 'none';
      }
    }

    function processSwipeResult(direction) {
      if (!isCramMode) {
        const cardIndex = cards.findIndex(c => c.id === currentStudyCard.id);
        if (cardIndex !== -1) {
          if (direction === 'right') {
            cards[cardIndex].srsLevel = Math.min(cards[cardIndex].srsLevel + 1, SRS_INTERVALS.length - 1);
          } else {
            cards[cardIndex].srsLevel = 0;
          }
          const intervalMinutes = SRS_INTERVALS[cards[cardIndex].srsLevel];
          cards[cardIndex].nextReview = Date.now() + (intervalMinutes * 60 * 1000);
          localStorage.setItem('mycards_v3', JSON.stringify(cards));
        }
      }

      studyQueue.shift();
      
      const swipeCont = document.getElementById('swipe-container');
      swipeCont.style.transition = 'transform 0.3s ease, opacity 0.3s';
      swipeCont.style.transform = `translateX(${direction === 'right' ? 300 : -300}px) rotate(${direction === 'right' ? 20 : -20}deg)`;
      swipeCont.style.opacity = '0';
      
      setTimeout(() => {
        swipeCont.style.transition = '';
        loadNextCard();
      }, 300);
    }

    // Обработчики свайпов (Tinder Effect)
    const swipeCont = document.getElementById('swipe-container');
    const flipCont = document.getElementById('flip-container');
    let startX = 0, currentX = 0, isDragging = false;

    swipeCont.addEventListener('click', (e) => {
      if (Math.abs(currentX) < 5) {
        isFlipped = !isFlipped;
        flipCont.classList.toggle('rotate-y-180', isFlipped);
      }
    });

    swipeCont.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      isDragging = true;
      swipeCont.classList.remove('snap-back');
    });

    swipeCont.addEventListener('touchmove', e => {
      if (!isDragging) return;
      currentX = e.touches[0].clientX - startX;
      swipeCont.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`;
    });

    swipeCont.addEventListener('touchend', e => {
      isDragging = false;
      const threshold = 100;
      if (currentX > threshold && isFlipped) {
        processSwipeResult('right');
      } else if (currentX < -threshold && isFlipped) {
        processSwipeResult('left');
      } else {
        swipeCont.classList.add('snap-back');
        swipeCont.style.transform = 'translateX(0) rotate(0deg)';
      }
      currentX = 0;
    });

    // Инициализация
    goHome();
  </script>
</body>
</html>
